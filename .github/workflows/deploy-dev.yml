name: Deploy to MonsterASP.NET (Dev)

on:
  push:
    branches:
      - develope

jobs:
  build-and-deploy:
    runs-on: windows-latest  # Windows runner includes MSDeploy CLI natively

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --configuration Release --no-restore

    - name: Publish Web API
      run: dotnet publish WadnereJwellors/WadnereJwellors.csproj --configuration Release --output ${{ github.workspace }}\publish

    - name: Deploy to MonsterASP.NET via WebDeploy
      uses: ChristopheLav/iis-deploy@v1
      with:
        website-name: 'site97466'
        msdeploy-service-url: 'https://site97466.siteasp.net:8172/msdeploy.axd'
        msdeploy-username: 'site97466'
        msdeploy-password: 'q#5Y6K!yC+n3'
        source-path: ${{ github.workspace }}\publish
        skip-extra-files: false